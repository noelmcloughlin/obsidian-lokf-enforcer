name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

# Least-privilege default: every scope starts read-only (or none). The build
# job below opts back into exactly the three write scopes it needs; no other
# job (present or future) inherits them.
permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            # Monitors the runner's outbound network traffic for the rest of this
            # job and flags anything unexpected — the main defense this workflow
            # has against a compromised dependency's postinstall script (`npm ci`
            # below runs esbuild's, which fetches a platform binary) trying to
            # exfiltrate GITHUB_TOKEN or phone home. Audit mode only: it observes
            # and reports, it does not block, since hand-maintaining an exact
            # egress allowlist here would be fragile against ordinary dependency
            # churn. See https://github.com/step-security/harden-runner.
            - name: Harden the runner
              uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
              with:
                  egress-policy: audit

            - name: Check out the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Obsidian matches a release to a plugin version by tag name, exact
            # string equality against manifest.json's "version" — no "v" prefix,
            # no partial match. Catch a mistagged push (e.g. `v0.2.0` instead of
            # `0.2.0`) here, before spending a build + attestation on a release
            # Obsidian's installer would never find.
            # The tag reaches the shell through the environment, never through
            # ${{ }} interpolation: a tag name is free-form text, and git permits
            # `$`, backticks and quotes in one, so interpolating it directly into
            # a run: block would let a pushed tag execute here.
            - name: Verify tag matches manifest version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::Tag '$TAG' does not match manifest.json version '$version'. Obsidian requires the release tag to equal the version exactly, with no leading 'v'. Delete this tag, then re-tag as '$version' (see CONTRIBUTING.md's release flow)."
                    exit 1
                  fi

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ github.ref_name }}
              run: |
                    gh release create "$TAG" \
                        --title="$TAG" \
                        --draft \
                        main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
